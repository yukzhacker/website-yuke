<!DOCTYPE html>
<html>
<head>
    <title>Website Yuke</title>
    <meta name="viewport"
    content="width=device-width,
    initial-scale=1.0">


<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 60px 20px;
        font-family: Arial, sans-serif;
        text-align: center;
        background: linear-gradient(135deg, #dbeafe, #eff6ff, #ffffff);
        color: #1e293b;
        min-height: 100vh;
    }

    h1 {
        font-size: 42px;
        color: #1e3a8a;
        margin-bottom: 10px;
        animation: fadeDown 1s ease;
    }

    p {
        font-size: 20px;
        color: #475569;
        animation: fadeUp 1s ease;
    }

    img {
        width: 250px;
        height: 300px;
        object-fit: cover;
        border-radius: 20px;
        margin: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        animation: fadeUp 1.2s ease;
    }

    img:hover {
        transform: translateY(-10px) scale(1.03);
        box-shadow: 0 18px 35px rgba(0, 0, 0, 0.25);
    }

    h1:hover {
        transform: scale(1.03);
        transition: 0.3s;
    }

    @keyframes fadeDown {
        from {
            opacity: 0;
            transform: translateY(-30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 600px) {
        body {
            padding: 40px 15px;
        }

        h1 {
            font-size: 30px;
        }

        p {
            font-size: 17px;
        }

        img {
            width: 90%;
            max-width: 250px;
            height: auto;
        }
    }
</style>
    
</head>
<body>

    <h1>Pofile Dewa Yuke</h1>

    <p>Welcome To My Website</p>
    
    <img src="foto.jpeg" alt="Foto saya"width="250">

    <img src="foto2.jpeg" alt="Foto Yuke"width="250">

</body>
</html>
